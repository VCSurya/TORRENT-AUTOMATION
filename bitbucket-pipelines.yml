                --exclude=".venv" \
                --exclude="temp" \
                --exclude="latest" \
                --exclude="bot" \
                -e "ssh -o StrictHostKeyChecking=no" \
                ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"


            # --- Create & update virtual environment on server ---
            # - echo "Configuring virtual environment on remote host..."
            # - |
            #   ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" bash -lc "
            #     cd '$DEPLOY_PATH'
 
            #     echo 'Checking virtual environment...'
            #     if [ ! -d .venv ]; then
            #       echo 'Creating new virtual environment...'
            #       python3.13 -m venv .venv
            #     else
            #       echo '.venv already exists — using existing environment.'
            #     fi
 
            #     echo 'Activating virtual environment...'
            #     source .venv/bin/activate
 
            #     echo 'Installing dependencies...'
            #     if [ -f requirements.txt ]; then
            #       pip install --upgrade pip
            #       pip install -r requirements.txt
            #     else
            #       echo '⚠️ requirements.txt not found — skipping dependency installation.'
            #     fi
            #   "
 
            # --- Restart Python service ---
            - echo "Restarting Python service..."
            - ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
